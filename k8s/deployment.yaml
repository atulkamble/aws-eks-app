apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-python-app
  namespace: cloudnautic
  labels:
    app: eks-python-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: eks-python-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: eks-python-app

    spec:
      containers:
        - name: eks-python-app
          image: 535002879962.dkr.ecr.us-east-1.amazonaws.com/cloudnautic/pythonapp:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: eks-app-config

            - secretRef:
                name: eks-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3