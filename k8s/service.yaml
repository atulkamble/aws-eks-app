apiVersion: v1
kind: Service
metadata:
  name: eks-python-service
  namespace: cloudnautic
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance

spec:
  type: LoadBalancer

  selector:
    app: eks-python-app

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
